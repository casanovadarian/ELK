input {
  udp {
    port => 5514
    type => "syslog"
  }
}


filter {
  mutate {
    remove_field => ["source_ip:"]
    add_field => { "source_ip" => "%{[host][ip]}" }
	}
    grok {
        match => { 
            "message" => [
	## Fallback para RFC 3164 (Logs clásicos)
#	'<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{PROG:syslog_program}: %{GREEDYDATA:syslog_message}', 
	'<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT}\])?: %{GREEDYDATA:syslog_message}',

	## RFC 5424 Simplificado (el formato que se está usando)
#	'<%{INT:syslog_pri}>1 %{TIMESTAMP_ISO8601:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{PROG:syslog_program} (?:%{WORD}|-)\s+(?:%{WORD}|-) %{GREEDYDATA:syslog_message}'
	'<%{INT:syslog_pri}>1 %{TIMESTAMP_ISO8601:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{PROG:syslog_program} (?:%{WORD}|-)\s+(?:%{WORD}|-) %{GREEDYDATA:syslog_message}'
	]
        }
        remove_field => ["@version", "syslog_pri"]
        }

        #---------------PARSEAR timestamp-----------
        date {
            match => ["syslog_timestamp", "ISO8601", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
            target => "@timestamp"
            timezone => "America/Havana"
        }

	# NUEVO: También analizar syslog_timestamp como campo de fecha
	date {
    	  match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    	  target => "syslog_timestamp"  # Sobrescribir el campo original
    	  locale => "en"
    	  tag_on_failure => []
}

        #--------------Normalizar minusculas
        mutate {
            lowercase => ["syslog_program"]
        }

        
        #--------firewall--------
	if [syslog_program] =~ /filterlog/ or [message] =~ /filterlog/ { 
        mutate {
            add_field => {"index_name" => "uclv-firewall"}
        }
        grok {
            match => {
#            "syslog_message" => "%{WORD:action} %{WORD:protocol} %{IP:src_ip}:%{INT:src_port} -> %{IP:dst_ip}:%{INT:dst_port}"
	     "syslog_message" => "-\s*%{INT:rule_num},,,%{INT:tracker_id},%{WORD:interface},%{WORD:reason},%{WORD:action},%{WORD:direction},%{INT:ip_version},%{WORD:ip_flags},,%{INT:ttl},%{INT:id},%{INT:offset},%{WORD:df},%{INT:proto_id},%{WORD:proto},%{INT:length},%{IP:src_ip},%{IP:dst_ip},%{INT:src_port},%{INT:dst_port}(?:,%{INT:data_length})?(?:,%{GREEDYDATA:options})?"
        }
      tag_on_failure => []    
# Limpiamos campos temporales
        remove_field => ["proto_id", "length", "ip_flags", "offset", "ip_version"]
      }
      }
    
        #----------captivo-----------
	else if [message] =~ /(logportalauth)/ {
        mutate {
            add_field => {"index_name" => "uclv-captivo"}
        }
        grok {
           match => {
#            "message" => [
#                '%{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:uclv_host_name} %{WORD:uclv_program}\[%{NUMBER:uclv_pid}\] Zone: %{WORD:uclv_zone} - %{DATA:uclv_event_type}: %{USERNAME:uclv_username}, %{MAC:uclv_mac_address}, %{IP:uclv_ip_address}'
#            ]

	    "syslog_message" => [	
		'Zone: %{WORD:uclv_zone} - %{DATA:uclv_event_type}: %{USERNAME:uclv_username}, %{MAC:uclv_mac_address}, %{IP:uclv_ip_address}'
            ]
	    }
            # Si no hay match, guardamos el mensaje en un campo alterno
            tag_on_failure => ["_grokparsefailure"]
            add_field => { "unparsed_message" => "%{message}" }
            }
    }

        #----------logs del sistema------
    else if([message] =~ /(?i)(error|reboot|daemon|Memory|CPU)/ or [syslog_program] =~ /(?i)pf/) {
        mutate {
            add_field => {"index_name" => "uclv-sistema"}
        }
        grok {
            match => {
            "syslog_message" => "%{DATA:system_component}: %{GREEDYDATA:system_message}"
                      }
            tag_on_failure => []
            }
    }

#######----------NGINX ACCESS LOGS (nginx)------
    # Si el programa es nginx, lo procesamos aquí
    else if [syslog_program] =~ /nginx/ {
        mutate {
            add_field => {"index_name" => "uclv-nginx"}
        }
        grok {
            # Patrón robusto para log de acceso Nginx (formato combinado) después de syslog
            match => {
                "syslog_message" => '(?:%{NOTSPACE:junk_field}\s+){1,4}%{IPORHOST:clientip}\s+%{NOTSPACE:ident}\s+%{NOTSPACE:auth}\s+\[%{HTTPDATE:timestamp}\]\s+"%{WORD:http_verb}\s+%{URIPATH:request_path}\s+HTTP/%{NUMBER:http_version}"\s+%{NUMBER:response_code}\s+%{NUMBER:bytes}\s+"%{DATA:referrer}"\s+"%{GREEDYDATA:user_agent}"'
            }
            tag_on_failure => ["_grokparsefailure_nginx"]
            # Limpiamos el campo timestamp del Grok si ya está en @timestamp
            remove_field => ["timestamp"]
        }
    }


	else {    
        # Para logs que no coincidan con ningun filtro
        mutate {
            add_field => { "index_name" => "uclv-otros" }
        }
 }
    # ==========================================================
    # NUEVA PARTE: Extraer fecha para el nombre del índice con la hora de la ZH Cuba
    # ==========================================================
    if [syslog_timestamp] {
        # Extraemos los primeros 10 caracteres (YYYY-MM-DD)
        grok {
            match => { "syslog_timestamp" => "^(?<indice_local>\d{4}-\d{2}-\d{2})" }
        }
        # Cambiamos guiones por puntos para que coincida con tu formato actual
        mutate {
            gsub => [ "indice_local", "-", "." ]
        }
    } else {
        # Fallback por si algún log no tiene syslog_timestamp
        mutate {
            add_field => { "indice_local" => "%{+YYYY.MM.dd}" }
        }
    }
}


output {
  elasticsearch {
    hosts => ["https://10.12.1.34:9200", "https://10.12.1.35:9200","https://10.12.1.36:9200"]

#    index => "%{index_name}---%{+YYYY.MM.dd.HH}"
    index => "%{index_name}-%{indice_local}"
