filter {
  # Solo procesamos si no ha sido marcado por HAProxy u otros filtros previos
  if !("log_procesado" in [tags]) {
    
    # Identificación por patrones comunes de switches (ej. %SYS, %LINK, %LINEPROTO)
    # Opcionalmente puedes filtrar por un rango de IPs si tus switches están en una VLAN específica
    if [message] =~ /%[A-Z0-9_]+-[0-7]-[A-Z0-9_]+/ {
      
      mutate {
        add_field => { "index_name" => "uclv-switches" }
        add_tag => ["log_procesado", "network_device"]
      }

      grok {
        match => {
          "syslog_message" => [
            # Formato estándar Cisco: %FACILITY-SEVERITY-MNEMONIC: message
            "%%{WORD:sw_facility}-%{INT:sw_severity}-%{WORD:sw_mnemonic}: %{GREEDYDATA:sw_message}",
            # Formato con secuencia de número: 123: %FACILITY...
            "%{INT:sw_seq}: %%{WORD:sw_facility}-%{INT:sw_severity}-%{WORD:sw_mnemonic}: %{GREEDYDATA:sw_message}"
          ]
        }
        tag_on_failure => ["_grokparsefailure_sw"]
      }

      # Enriquecimiento: Traducir niveles de severidad numéricos a texto
      if [sw_severity] {
        mutate {
          add_field => { "sw_severity_label" => "unknown" }
        }
        if [sw_severity] == "0" { mutate { replace => { "sw_severity_label" => "emergencia" } } }
        if [sw_severity] == "1" { mutate { replace => { "sw_severity_label" => "alerta" } } }
        if [sw_severity] == "2" { mutate { replace => { "sw_severity_label" => "critico" } } }
        if [sw_severity] == "3" { mutate { replace => { "sw_severity_label" => "error" } } }
        if [sw_severity] == "4" { mutate { replace => { "sw_severity_label" => "advertencia" } } }
        if [sw_severity] == "5" { mutate { replace => { "sw_severity_label" => "notificacion" } } }
        if [sw_severity] == "6" { mutate { replace => { "sw_severity_label" => "informacion" } } }
        if [sw_severity] == "7" { mutate { replace => { "sw_severity_label" => "depuracion" } } }
      }
    }
  }
}

