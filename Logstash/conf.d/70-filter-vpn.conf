filter {
  #----------VPN SoftEther (vpn-uclv, 10.12.1.242)----------
  if !("log_procesado" in [tags]) and [syslog_program] == "vpn" {

    # Ruido: los HAProxy comprueban el puerto 5555 cada pocos segundos y cada comprobación genera
    # ~6 líneas (era el 70 % de uclv-otros). Las líneas con el CID pero sin IP de esas conexiones
    # (SSL iniciado / conexión terminada) no permiten distinguir la comprobación de un cliente real
    # y no aportan información, así que también se descartan.
    # Las líneas [HUB "..."] son de sesiones reales y nunca se descartan: los usuarios también
    # entran a través de los HAProxy, así que llevan su IP.
    if [syslog_message] !~ /\[HUB "/ and (
         [syslog_message] =~ /IP address:? 10\.12\.1\.(5|9|72|73|74|80)[,)]/
         or [syslog_message] =~ /SSL communication for connection "CID-\d+" has been started/
         or [syslog_message] =~ /Connection "CID-\d+" has been terminated\./
         or [syslog_message] =~ /non-SoftEther VPN software has connected/ ) {
      drop { }
    }

    mutate {
      replace => { "index_name" => "uclv-vpn" }
      add_tag => ["log_procesado"]
    }

    grok {
      match => {
        "syslog_message" => [
          '\[HUB "%{DATA:vpn_hub}"\] Connection "%{NOTSPACE:vpn_conexion}": Successfully authenticated as user "%{DATA:vpn_usuario}"',
          '\[HUB "%{DATA:vpn_hub}"\] Session "[^"]+": The DHCP server .*? for host "(?<vpn_sesion>[^"]+)" on another session.*?the new IP address %{IP:vpn_ip_asignada}',
          '\[HUB "%{DATA:vpn_hub}"\] Connection "%{NOTSPACE:vpn_conexion}": The new session "(?<vpn_sesion>[^"]+)" has been created\. \(IP address: %{IP:vpn_cliente_ip}',
          '\[HUB "%{DATA:vpn_hub}"\] Session "%{NOTSPACE:vpn_sesion}": %{GREEDYDATA:vpn_mensaje}',
          '\[HUB "%{DATA:vpn_hub}"\] Connection "%{NOTSPACE:vpn_conexion}": %{GREEDYDATA:vpn_mensaje}',
          'IP address:? %{IP:vpn_cliente_ip}',
          'Connection "%{NOTSPACE:vpn_conexion}" terminated by the cause "%{DATA:vpn_motivo}"'
        ]
      }
      tag_on_failure => []
    }

    # Los SID tienen la forma SID-<USUARIO>-<n>
    if [vpn_sesion] and ![vpn_usuario] {
      grok {
        match => { "vpn_sesion" => '^SID-(?<vpn_usuario>(?!LOCALBRIDGE)[^-]+)-\d+$' }
        tag_on_failure => []
      }
      mutate { lowercase => ["vpn_usuario"] }
    }
  }
}
