filter {
  #----------Índice de destino y limpieza final----------
  # El índice se calcula aquí y viaja en @metadata, que no se guarda en Elasticsearch.
  if ![index_name] {
    mutate { add_field => { "index_name" => "uclv-otros" } }
  }
  # Si dos filtros asignaron índice, gana el primero (un array generaba "a,b-fecha", que ES rechaza)
  if [index_name][1] {
    mutate { replace => { "[@metadata][index]" => "%{[index_name][0]}" } }
  } else {
    mutate { replace => { "[@metadata][index]" => "%{index_name}" } }
  }
  mutate {
    replace => { "[@metadata][fecha]" => "%{indice_local}" }
  }

  # Si el parseo base funcionó, syslog_message tiene el texto y la cabecera ya está en
  # syslog_hostname/syslog_program/@timestamp: message sería una copia.
  if [syslog_message] and [message] {
    mutate { remove_field => ["message"] }
  }

  # Campos repetidos en cada documento: event.original es una 2ª copia de message (ECS),
  # host.ip ya está en source_ip, y type/@version/index_name/indice_local no aportan nada.
  mutate {
    remove_field => ["[event]", "[host]", "type", "@version", "index_name", "indice_local"]
  }
}
