filter {
  #----------HAProxy (proxies inversos)----------
  # El formato se detecta por el contenido, no por el nombre del frontend, así los frontends nuevos
  # (vm-*, ftp_front, http-8080...) se parsean sin tocar esta configuración.
  if !("log_procesado" in [tags]) {
    if [source_ip] in ["10.12.1.5", "10.12.1.9", "10.12.1.74", "10.12.1.73", "10.12.1.72", "10.12.1.80"] and ([syslog_program] == "haproxy" or [message] =~ /haproxy\[[0-9]+\]:/ ) {

      mutate {
        replace => { "index_name" => "uclv-ha-inverso" }
        add_tag => ["log_procesado", "haproxy"]
      }

      grok {
        pattern_definitions => {
          "HA_PREFIJO" => "^<%{INT}>%{SYSLOGTIMESTAMP} %{PROG:syslog_program}\[%{INT}\]: "
          "HA_CLIENTE" => "%{IP:client_ip}:%{INT:client_port:int} \[%{HAPROXYDATE:haproxy_timestamp}\] %{NOTSPACE:haproxy_frontend}"
          "HA_DESTINO" => "%{NOTSPACE:haproxy_backend}/%{NOTSPACE:haproxy_server}"
          "HA_CONEX"   => "%{INT:actconn:int}/%{INT:feconn:int}/%{INT:beconn:int}/%{INT:srv_conn:int}/%{INT:retries:int} %{INT:srv_queue:int}/%{INT:backend_queue:int}"
        }
        match => {
          "message" => [
            # HTTP (la línea de petición puede venir truncada por HAProxy, por eso el HTTP/x.y es opcional)
            '%{HA_PREFIJO}%{HA_CLIENTE} %{HA_DESTINO} %{INT:Tq:int}/%{INT:Tw:int}/%{INT:Tc:int}/%{INT:Tr:int}/%{INT:Tt:int} %{INT:http_status:int} %{INT:bytes_read:int} %{NOTSPACE:req_cookie} %{NOTSPACE:res_cookie} %{NOTSPACE:termination_state} %{HA_CONEX}(?: \{%{DATA:captured_request_headers}\})? "%{WORD:http_method} %{NOTSPACE:http_request}(?: HTTP/%{NUMBER:http_version})?',
            # TCP (mqtt, smtp, imap, ftp, vm-*...)
            '%{HA_PREFIJO}%{HA_CLIENTE} %{HA_DESTINO} %{INT:Tw:int}/%{INT:Tc:int}/%{INT:Tt:int} %{INT:bytes_read:int} %{NOTSPACE:termination_state} %{HA_CONEX}',
            # Errores de conexión: "https-in/1: SSL handshake failure"
            '%{HA_PREFIJO}%{HA_CLIENTE}: %{GREEDYDATA:haproxy_error}',
            # Mensajes del propio HAProxy: "Proxy X started.", avisos de servidores caídos...
            '%{HA_PREFIJO}%{GREEDYDATA:haproxy_admin}'
          ]
        }
        tag_on_failure => ["_haproxy_parse_failed"]
      }

      if [http_method] {
        mutate { add_field => { "haproxy_mode" => "http" } }
      } else if [termination_state] {
        mutate { add_field => { "haproxy_mode" => "tcp" } }
      } else if [haproxy_error] {
        mutate { add_field => { "haproxy_mode" => "error" } }
      } else if [haproxy_admin] {
        mutate { add_field => { "haproxy_mode" => "admin" } }
      }

      # Cabeceras capturadas: {host|||user-agent|host}
      if [captured_request_headers] {
        grok {
          match => { "captured_request_headers" => '^(?<http_host>[^|]*)\|[^|]*\|[^|]*\|(?<user_agent>[^|]*)' }
          tag_on_failure => []
        }
        if [http_host] {
          mutate { remove_field => ["captured_request_headers"] }
        }
      }

      if [haproxy_timestamp] {
        # Hora real de la petición (la de llegada a Logstash va unos segundos por detrás)
        date {
          match => ["haproxy_timestamp", "dd/MMM/yyyy:HH:mm:ss.SSS"]
          target => "@timestamp"
          timezone => "America/Havana"
          locale => "en"
          tag_on_failure => []
        }
      }

      # Ahorro de espacio: si el log se parseó, el texto original no aporta nada (antes se guardaba 3 veces).
      if !("_haproxy_parse_failed" in [tags]) and [haproxy_mode] in ["http", "tcp", "error"] {
        mutate {
          remove_field => ["message", "haproxy_timestamp", "syslog_timestamp", "pid"]
        }
      }
      mutate { strip => ["haproxy_error", "haproxy_admin"] }
      if [req_cookie] == "-" { mutate { remove_field => ["req_cookie"] } }
      if [res_cookie] == "-" { mutate { remove_field => ["res_cookie"] } }
    }
  }
}
