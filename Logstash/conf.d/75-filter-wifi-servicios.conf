filter {
  #----------Servicios del pfSense del wifi (wifi.uclv.cu): DHCP, DNS y ruido----------
  if !("log_procesado" in [tags]) {

    #--- DHCP (kea): asignaciones MAC -> IP, para cruzar con el portal cautivo ---
    if [syslog_program] == "kea-dhcp4" {
      # EVAL_RESULT: evaluación interna de las reglas de cada pool (~280.000 líneas/día sin información útil)
      if [syslog_message] =~ /EVAL_RESULT/ {
        drop { }
      }
      mutate {
        replace => { "index_name" => "uclv-dhcp" }
        add_tag => ["log_procesado"]
      }
      grok {
        match => {
          "syslog_message" => [
            '%{LOGLEVEL:dhcp_nivel}\s+\[[^\]]+\] DHCP4_%{NOTSPACE:dhcp_evento} \[hwtype=\d+ %{MAC:dhcp_mac}\].*?: lease %{IP:dhcp_ip} has been allocated for %{INT:dhcp_lease_segundos:int} seconds',
            '%{LOGLEVEL:dhcp_nivel}\s+\[[^\]]+\] DHCP4_%{NOTSPACE:dhcp_evento} \[hwtype=\d+ %{MAC:dhcp_mac}\].*?(?:lease|address) %{IP:dhcp_ip}',
            '%{LOGLEVEL:dhcp_nivel}\s+\[[^\]]+\] DHCP4_%{NOTSPACE:dhcp_evento} \[hwtype=\d+ %{MAC:dhcp_mac}\]',
            '%{LOGLEVEL:dhcp_nivel}\s+\[[^\]]+\] %{NOTSPACE:dhcp_evento}'
          ]
        }
        tag_on_failure => ["_grokparsefailure_dhcp"]
      }
      mutate { lowercase => ["dhcp_mac"] }
    }

    #--- DNS (unbound): consultas de los clientes ---
    else if [syslog_program] == "unbound" and [syslog_message] =~ /info: \d+\.\d+\.\d+\.\d+ \S+ [A-Z0-9]+ IN$/ {
      mutate {
        replace => { "index_name" => "uclv-dns" }
        add_tag => ["log_procesado"]
      }
      grok {
        match => { "syslog_message" => 'info: %{IP:dns_cliente_ip} %{NOTSPACE:dns_consulta} %{NOTSPACE:dns_tipo} IN$' }
        tag_on_failure => ["_grokparsefailure_dns"]
      }
      mutate { gsub => ["dns_consulta", "\.$", ""] }
      if !("_grokparsefailure_dns" in [tags]) {
        mutate { remove_field => ["message", "syslog_message"] }
      }
    }

    #--- Ruido sin valor ---
    else if [syslog_program] == "/usr/sbin/cron" or [syslog_program] == "cron"
         or ([syslog_program] == "snmpd" and [syslog_message] =~ /truncating integer value/) {
      drop { }
    }
  }
}
