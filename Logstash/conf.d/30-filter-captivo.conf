filter {
  #----------portal cautivo (pfSense wifi.uclv.cu, logportalauth)----------
  # Formato: Zone: <zona> - <EVENTO>: <usuario>, <mac>, <ip>[, <motivo>]
  # El usuario puede venir vacío (FAILURE: , mac, ip, Invalid credentials specified.)
  if !("log_procesado" in [tags]) and [syslog_program] == "logportalauth" {

    mutate {
      replace => { "index_name" => "uclv-captivo" }
      add_tag => ["log_procesado"]
    }

    grok {
      match => {
        "syslog_message" => [
          'Zone: %{NOTSPACE:uclv_zone} - %{DATA:uclv_event_type}: %{DATA:uclv_username}, %{MAC:uclv_mac_address}, %{IP:uclv_ip_address}(?:, %{GREEDYDATA:uclv_reason})?$',
          'Zone: %{NOTSPACE:uclv_zone} - %{DATA:uclv_input_invalido} invalid: %{GREEDYDATA:uclv_reason}$'
        ]
      }
      tag_on_failure => ["_grokparsefailure_captivo"]
    }

    if [uclv_input_invalido] {
      # Validación del formulario: lo tecleado puede ser una contraseña escrita en el campo de usuario,
      # así que no se guarda ni el valor ni el mensaje original.
      mutate {
        replace => { "uclv_event_type" => "INPUT INVALIDO" }
        gsub => ["uclv_reason", " found in .*$", ""]
        remove_field => ["uclv_input_invalido", "message", "syslog_message", "[event][original]"]
      }
    }

    # Acción normalizada para seguir la sesión de cada usuario/MAC
    if [uclv_event_type] == "ACCEPT" {
      mutate { add_field => { "uclv_accion" => "login" } }
    } else if [uclv_event_type] =~ /^CONCURRENT LOGIN/ {
      mutate { add_field => { "uclv_accion" => "login_reutilizado" } }
    } else if [uclv_event_type] in ["DISCONNECT", "IDLE TIMEOUT", "SESSION TIMEOUT"] {
      mutate { add_field => { "uclv_accion" => "logout" } }
    } else if [uclv_event_type] == "FAILURE" {
      mutate { add_field => { "uclv_accion" => "fallo" } }
    } else if [uclv_event_type] == "ERROR" {
      mutate { add_field => { "uclv_accion" => "error" } }
    } else if [uclv_event_type] == "INPUT INVALIDO" {
      mutate { add_field => { "uclv_accion" => "fallo" } }
    }

    if [uclv_username] == "" {
      mutate { remove_field => ["uclv_username"] }
    }
    mutate {
      lowercase => ["uclv_mac_address"]
      strip => ["uclv_reason"]
    }
  }
}
