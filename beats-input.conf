#------------INPUT------------
input {
    beats{
        port => 5044
    }
}

#-----------FILTROS-----------
filter{

    #----------Primero extraer campos claves-------------
    grok {
        match => { 
            "message" => "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{PROG:syslog_program}: %{GREEDYDATA:syslog_message}" 
        }
        remove_field => ["@version", "syslog_pri"]
        }

        #---------------PARSEAR timestamp del syslog-----------
        date {
            match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
            target => "@timestamp"
#            timezone => "America/Habana"
        }

        #--------------Normalizar minusculas
        mutate {
            lowercase => ["syslog_program"]
        }

    
        
        #--------firewall--------
	if [program] =~ /filterlog/ or [message] =~ /filterlog/ { 
        mutate {
            add_field => {"index_name" => "pfsense-firewall"}
        }
        grok {
            match => {
            "message" => "%{WORD:action} %{WORD:protocol} %{IP:src_ip}:%{INT:src_port} -> %{IP:dst_ip}:%{INT:dst_port}"
        }
      tag_on_failure => []    
      }
      }
    
        #----------captivo-----------
	else if [message] =~ /(logportalauth)/ {
        mutate {
            add_field => {"index_name" => "pfsense-captivo"}
        }
        grok {
           match => {
            "message" => [
                #--------------------------------------Para Nginx---------------------------------
#                '%{HOSTNAME:d_host_name} %{WORD:d_program} %{IP:d_client_ip} %{DATA:d_ident} %{DATA:d_auth_user} \[%{HTTPDATE:d_request_time}\] "%{WORD:d_verb} %{URIPATHPARAM:d_request} HTTP/%{NUMBER:d_http_version}" %{NUMBER:d_status} %{NUMBER:d_bytes} "(%{URI:d_referrer}|-)" "%{DATA:d_user_agent}"',
                #-------------------------------------Para logportalauth------------------------------------
                '%{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:uclv_host_name} %{WORD:uclv_program}\[%{NUMBER:uclv_pid}\] Zone: %{WORD:uclv_zone} - %{DATA:uclv_event_type}: %{USERNAME:uclv_username}, %{MAC:uclv_mac_address}, %{IP:uclv_ip_address}'
            ]
            }
            # Si no hay match, guardamos el mensaje en un campo alterno
            tag_on_failure => ["_grokparsefailure"]
            add_field => { "unparsed_message" => "%{message}" }
            }
    }

        #----------logs del sistema------
    else if([message] =~ /(?i)(error|reboot|daemon|Memory|CPU)/ or [syslog_program] =~ /(?i)pf/) {
        mutate {
            add_field => {"index_name" => "pfsense-sistema"}
        }
        grok {
            match => {
            "syslog_message" => "%{DATA:system_component}: %{GREEDYDATA:system_message}"
                      }
            tag_on_failure => []
            }
    }
    
        #-----------VPN-------------
    else if ([message] =~ /(?i)(connection established|connection reset|VPN user)/ or [syslog_program] =~ /(vpn|openvpn)/) {
        mutate {
            add_field => {"index_name" => "pfsense-VPN"}
        }
        grok {
            match => {
              "syslog_message" => "Peer Connection Initiated with \[%{IP:remote_ip}:%{INT:remote_port}\]"
             }
          tag_on_failure => []
             }
    }

        #-----------DHCP y DNS-----------
    else if ([message] =~ /(?i)(DHCPREQUEST|DHCPACK|DHCPDECLINE|query)/ or [syslog_program] =~ /(dhcp|dns|dnsmasq)/) {
        mutate {
            add_field => {"index_name" => "pfsense-DHCP-DNS"}
                }
        grok {
            match => {
                "syslog_message" => "DHCPACK on %{IP:client_ip} to %{MAC:client_mac} \(%{DATA:hostname}\)"
                }
             tag_on_failure => []
            }
    }

        #-----------IDS ISP------------
    else if ([syslog_program] =~ /(snort|suricata)/) {
        mutate {
            add_field => {"index_name" => "pfsense-ids-ips"}
        }
        grok {
            match => {
            "syslog_message" => "\[%{DATA:alert_type}\] \[%{DATA:alert_code}\] %{GREEDYDATA:alert_message}"
                    }
            tag_on_failure => []
            }
    }


    else {
        # Para logs que no coincidan con ningun filtro
        mutate {
            add_field => { "index_name" => "pfsense-otros" }
        }
    }
}




# ---- Output (Salida) ----
output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    # Usamos el campo que creamos en el filtro para el nombre del índice
    index => "%{index_name}-%{+YYYY.MM.dd}"
  }
  # Opcional: imprimir en la consola para depuración
  #stdout { codec => rubydebug }
}
